apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu-workload
          effect: NoSchedule
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - >-
              until nc -z mlflow-postgres 5432 && nc -z minio 9000;
              do echo 'waiting for PostgreSQL and MinIO'; sleep 3; done
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.3.2
          command: ["sh", "-c"]
          args:
            - >-
              pip install --no-cache-dir boto3==1.40.21 psycopg2-binary==2.9.10 &&
              mlflow server
              --host 0.0.0.0
              --port 5000
              --backend-store-uri "$MLFLOW_BACKEND_STORE_URI"
              --default-artifact-root "$MLFLOW_ARTIFACT_ROOT"
              --allowed-hosts '*'
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio.application.svc.cluster.local:9000
            - name: MLFLOW_BACKEND_STORE_URI
              value: postgresql://mlflow:mlflow-demo-password@mlflow-postgres.application.svc.cluster.local:5432/mlflow
            - name: MLFLOW_ARTIFACT_ROOT
              value: s3://mlflow-artifacts
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
