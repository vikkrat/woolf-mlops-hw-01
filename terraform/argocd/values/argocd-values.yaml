# Для навчального середовища UI доступний лише через локальний port-forward.
server:
  service:
    type: ClusterIP
  extraArgs:
    - --insecure

configs:
  params:
    server.insecure: true
    controller.operation.processors: "5"
    controller.status.processors: "10"
    controller.repo.server.timeout.seconds: "180"
  rbac:
    policy.default: role:readonly
    scopes: "[groups]"

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

repoServer:
  # Рендеринг kube-prometheus-stack та кількох Applications паралельно потребує
  # більше пам'яті, ніж початкові 256 MiB. Окремий worker node запобігає
  # конкуренції repo-server з Argo CD controller та server.
  nodeSelector:
    workload: gpu-simulated
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu-workload
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
