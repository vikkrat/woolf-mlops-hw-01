stages: [validate, test, build, security, train, promote]

variables:
  PROJECT_DIR: final-project
  AWS_DEFAULT_REGION: eu-north-1
  DOCKER_TLS_CERTDIR: "/certs"

.aws_oidc:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    # STS видає короткоживучі credentials; довготривалих access keys немає.
    - >-
      AWS_STS_CREDENTIALS="$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gitlab-${CI_PIPELINE_ID}-${CI_JOB_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 900
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)"
    - set -- $AWS_STS_CREDENTIALS
    - export AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3"

terraform-validate:
  stage: validate
  image: hashicorp/terraform:1.13.0
  script:
    - cd "$PROJECT_DIR/terraform"
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate

helm-lint:
  stage: validate
  image: alpine/helm:3.18.4
  script:
    - helm lint "$PROJECT_DIR/helm/inference"
    - helm lint "$PROJECT_DIR/helm/mlflow"
    - helm lint "$PROJECT_DIR/helm/observability-addons"

python-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths: [.cache/pip]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  script:
    - pip install -r "$PROJECT_DIR/inference-service/requirements-dev.txt"
    - pip install -r "$PROJECT_DIR/training/requirements.txt" pytest ruff
    - ruff check "$PROJECT_DIR/inference-service/app" "$PROJECT_DIR/inference-service/tests" "$PROJECT_DIR/training/src" "$PROJECT_DIR/training/tests"
    - PYTHONPATH="$PROJECT_DIR/inference-service" pytest -q "$PROJECT_DIR/inference-service/tests"
    - PYTHONPATH="$PROJECT_DIR/training" pytest -q "$PROJECT_DIR/training/tests"
    - pytest -q "$PROJECT_DIR/step-functions/tests"

build-images:
  stage: build
  image: docker:27.5.1
  services: [docker:27.5.1-dind]
  extends: .aws_oidc
  before_script:
    - apk add --no-cache aws-cli
    - !reference [.aws_oidc, before_script]
    - aws ecr get-login-password | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
  script:
    - export IMAGE_TAG="$CI_COMMIT_SHA"
    - docker build -t "$INFERENCE_REPOSITORY:$IMAGE_TAG" "$PROJECT_DIR/inference-service"
    - docker build -t "$TRAINING_REPOSITORY:$IMAGE_TAG" "$PROJECT_DIR/training"
    - docker build -t "$MLFLOW_REPOSITORY:$IMAGE_TAG" "$PROJECT_DIR/mlflow-server"
    - docker push "$INFERENCE_REPOSITORY:$IMAGE_TAG"
    - docker push "$TRAINING_REPOSITORY:$IMAGE_TAG"
    - docker push "$MLFLOW_REPOSITORY:$IMAGE_TAG"
    - printf '%s\n' "$INFERENCE_REPOSITORY:$IMAGE_TAG" "$TRAINING_REPOSITORY:$IMAGE_TAG" "$MLFLOW_REPOSITORY:$IMAGE_TAG" > built-images.txt
  artifacts:
    paths: [built-images.txt]
    expire_in: 1 day

container-scan:
  stage: security
  image:
    name: aquasec/trivy:0.65.0
    entrypoint: [""]
  extends: .aws_oidc
  before_script:
    - apk add --no-cache aws-cli
    - !reference [.aws_oidc, before_script]
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$INFERENCE_REPOSITORY:$CI_COMMIT_SHA"

train-model:
  stage: train
  image: amazon/aws-cli:2.27.49
  extends: .aws_oidc
  script:
    - >-
      EXECUTION_ARN=$(aws stepfunctions start-execution
      --state-machine-arn "$STATE_MACHINE_ARN"
      --name "train-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
      --input "{\"source\":\"gitlab-ci\",\"git_sha\":\"${CI_COMMIT_SHA}\"}"
      --query executionArn --output text)
    - >-
      while [ "$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text)" = "RUNNING" ];
      do sleep 10; done
    - test "$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text)" = "SUCCEEDED"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

promote-production:
  stage: promote
  image: amazon/aws-cli:2.27.49
  extends: .aws_oidc
  before_script:
    - !reference [.aws_oidc, before_script]
    - curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl"
    - chmod +x /usr/local/bin/kubectl
    - aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME"
  script:
    - test -n "$MODEL_VERSION"
    - >-
      sed
      -e "s#__MODEL_VERSION__#${MODEL_VERSION}#g"
      -e "s#__PIPELINE_ID__#${CI_PIPELINE_ID}#g"
      -e "s#__TRAINING_IMAGE__#${TRAINING_REPOSITORY}:${CI_COMMIT_SHA}#g"
      -e "s#__ARTIFACT_BUCKET__#${ARTIFACT_BUCKET}#g"
      -e "s#__GITLAB_USER__#${GITLAB_USER_LOGIN}#g"
      -e "s#__GIT_SHA__#${CI_COMMIT_SHA}#g"
      "$PROJECT_DIR/gitops/promotion-job.yaml.tpl" | kubectl create -f -
    - kubectl -n mlops-system wait --for=condition=complete "job/promote-${MODEL_VERSION}-${CI_PIPELINE_ID}" --timeout=10m
    - kubectl -n mlops-system logs "job/promote-${MODEL_VERSION}-${CI_PIPELINE_ID}"
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
