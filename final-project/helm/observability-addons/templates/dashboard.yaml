apiVersion: v1
kind: ConfigMap
metadata:
  name: iris-inference-dashboard
  labels: {grafana_dashboard: "1"}
data:
  iris-inference.json: |-
    {
      "title": "Iris Inference - SLO and Model Quality",
      "uid": "iris-mlops-final",
      "schemaVersion": 39,
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"type":"timeseries","title":"Request rate","targets":[{"expr":"sum(rate(inference_requests_total[5m]))"}],"gridPos":{"h":8,"w":8,"x":0,"y":0}},
        {"type":"timeseries","title":"Latency p50 / p95","targets":[{"expr":"histogram_quantile(0.50, sum by (le) (rate(inference_request_duration_seconds_bucket[5m])))","legendFormat":"p50"},{"expr":"histogram_quantile(0.95, sum by (le) (rate(inference_request_duration_seconds_bucket[5m])))","legendFormat":"p95"}],"gridPos":{"h":8,"w":8,"x":8,"y":0}},
        {"type":"timeseries","title":"HTTP error rate","targets":[{"expr":"sum(rate(inference_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(inference_requests_total[5m])), 0.001)"}],"gridPos":{"h":8,"w":8,"x":16,"y":0}},
        {"type":"timeseries","title":"CPU by pod","targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{container=\"api\"}[5m]))"}],"gridPos":{"h":8,"w":12,"x":0,"y":8}},
        {"type":"timeseries","title":"Memory by pod","targets":[{"expr":"sum by (pod) (container_memory_working_set_bytes{container=\"api\"})"}],"gridPos":{"h":8,"w":12,"x":12,"y":8}},
        {"type":"stat","title":"Evidently drift score","targets":[{"expr":"model_data_drift_score"}],"gridPos":{"h":6,"w":24,"x":0,"y":16}}
      ]
    }
