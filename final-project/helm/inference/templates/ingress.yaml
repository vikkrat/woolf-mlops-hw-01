{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iris-inference-stable
  labels:
    {{- include "iris.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iris-inference-stable
                port: {number: 8000}
{{- if .Values.canary.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iris-inference-canary
  labels:
    {{- include "iris.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: {{ .Values.canary.weight | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iris-inference-canary
                port: {number: 8000}
{{- end }}
{{- end }}
