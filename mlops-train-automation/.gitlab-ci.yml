stages:
  - validate
  - train

validate-terraform:
  stage: validate
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  script:
    - terraform -chdir=terraform fmt -check -recursive
    - terraform -chdir=terraform init -backend=false
    - terraform -chdir=terraform validate

train-model:
  stage: train
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  script:
    # Обмінюємо GitLab OIDC JWT на тимчасові AWS credentials. Довготривалі
    # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY у GitLab не потрібні.
    - >-
      CREDS=$(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gitlab-${CI_PIPELINE_ID}"
      --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 900
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo "$CREDS" | awk '{print $3}')
    - export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
    - test -n "$STATE_MACHINE_ARN"
    - test -n "$AWS_DEFAULT_REGION"
    - EXECUTION_NAME="train-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
    - >-
      EXECUTION_ARN=$(aws stepfunctions start-execution
      --state-machine-arn "$STATE_MACHINE_ARN"
      --name "$EXECUTION_NAME"
      --input "{\"source\":\"gitlab-ci\",\"commit\":\"$CI_COMMIT_SHORT_SHA\"}"
      --query executionArn --output text)
    - echo "Started $EXECUTION_ARN"
    - >-
      for attempt in $(seq 1 20); do
      STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text);
      echo "Execution status: $STATUS";
      [ "$STATUS" = "SUCCEEDED" ] && exit 0;
      [ "$STATUS" = "FAILED" ] && exit 1;
      sleep 2;
      done;
      exit 1
